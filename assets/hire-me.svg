        <animate id="d1" attributeName="d" begin="d0.end" dur="3300ms" fill="remove" values="m0,30 h0 ; m0,30 h960 ; m0,30 h960 ; m0,30 h0" keyTimes="0;0.67878787878788;0.83030303030303;1"/>
    </path>
    <text font-family="&quot;JetBrains Mono&quot;, monospace" fill="#36BCF7" font-size="24" dominant-baseline="middle" x="50%" text-anchor="middle" letter-spacing="normal">
