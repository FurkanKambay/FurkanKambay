<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 60" style="background-color: #00000000;" width="960px" height="60px">

    <style>
@font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400;
    font-display: fallback;
    src: url(data:font/truetype;base64,) format('truetype');
}
    </style>

    <path id="path0">
